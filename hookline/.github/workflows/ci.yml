name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hookline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hookline
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      # The delivery tests already run the server end to end; this checks the
      # command itself starts, migrates, and answers.
      - name: the binary works
        run: |
          export HOOKLINE_DATABASE=$RUNNER_TEMP/ci.db
          export HOOKLINE_LISTEN=127.0.0.1:8099
          ./target/release/hookline migrate
          ./target/release/hookline key create ci admin > /dev/null
          ./target/release/hookline serve &
          for _ in $(seq 1 50); do
            ./target/release/hookline health && break
            sleep 0.2
          done
          ./target/release/hookline health

  consumers:
    # The verification snippets in docs/consumers.md are the first code a
    # customer of a customer ever runs. A signature example that does not
    # verify is worse than none, so they are checked rather than written.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: ./examples/consumers/check.sh
        working-directory: hookline
