[workspace]

[package]
name = "hookline"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Reliable webhook delivery: retries, signatures, replay, and an audit trail. Self-hosted, single binary."
license = "MIT"
readme = "README.md"
repository = "https://github.com/adk24211/aiiiia"
keywords = ["webhooks", "delivery", "retries", "signatures", "queue"]
categories = ["web-programming", "network-programming"]

[lib]
name = "hookline"
path = "src/lib.rs"

[[bin]]
name = "hookline"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tower = { version = "0.5", default-features = false }
hyper = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = { version = "0.8", features = ["small_rng"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
